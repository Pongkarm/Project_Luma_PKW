worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    underscores_in_headers on;
    client_max_body_size 50M;

    # =========================================================================
    # รูปแบบ LOG แสดงการส่งต่อข้อมูลข้ามเครื่องอย่างชัดเจน (เห็น IP ต้นทางและปลายทาง)
    # =========================================================================
    log_format luma_traffic '[$time_local] [CLIENT: $remote_addr] -> "$request" -> [FORWARD_TO: $upstream_addr] (STATUS: $status, TIME: ${upstream_response_time}s)';
    access_log logs/access.log luma_traffic;

    # =========================================================================
    # UPSTREAM SERVERS (เครื่องในวงแลนของเพื่อน)
    # =========================================================================
    # 1. Frontend Node (HTML / CSS / JS) -> เครื่อง 172.20.10.8 พอร์ต 5500
    upstream frontend_node {
        server 172.20.10.8:5500;
    }

    # 2. Backend Node (FastAPI / SQLite) -> เครื่อง 172.20.10.6 พอร์ต 8000
    upstream backend_node {
        server 172.20.10.6:8000;
    }

    # =========================================================================
    # NGINX REVERSE PROXY GATEWAY (Port 80 บนเครื่องนี้ 172.20.10.9)
    # =========================================================================
    server {
        listen 80;
        server_name luma.local www.luma.local 172.20.10.9 localhost;

        # ---------------------------------------------------------------------
        # สิทธิ์ความปลอดภัยระดับเครือข่าย: อนุญาตเฉพาะเครื่องในวงแลน (LAN) และ Localhost
        # ---------------------------------------------------------------------
        allow 127.0.0.1;
        allow ::1;
        allow 172.20.10.0/24;     # Subnet วงแลนโปรเจกต์ (172.20.10.x สำหรับเครื่องในกลุ่ม)
        allow 192.168.0.0/16;     # รองรับวงแลน Wi-Fi ทั่วไป (เผื่อสลับเครือข่าย)
        allow 10.0.0.0/8;         # Private IP Class A
        deny all;                 # ปฏิเสธ IP นอกวงแลนทั้งหมด (HTTP 403)

        # Headers พื้นฐานและการส่งต่อ IP จริงของผู้ใช้
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # เงื่อนไขความปลอดภัย: ระบุว่าคำขอนี้วิ่งผ่าน Nginx เสมอ
        proxy_set_header X-Gateway-Proxy "luma-nginx";
        proxy_set_header X-LUMA-INTERNAL-SECRET $http_x_luma_internal_secret;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Timeout 300s สำหรับประมวลผลรูป AI
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # ---------------------------------------------------------------------
        # 0. DevOps Status Dashboard (คนที่ 4: QA / DevOps)
        # ใช้ Regex Priority สูงกว่า location / ดึงไฟล์จากโฟลเดอร์ nginx/html
        # ---------------------------------------------------------------------
        location ~* ^/dashboard(\.html)?$ {
            # สิทธิ์ความปลอดภัย DevOps: อนุญาตเฉพาะเครื่อง Nginx (172.20.10.9 และ Localhost) เท่านั้น
            allow 127.0.0.1;
            allow ::1;
            allow 172.20.10.9;
            deny all;

            root html;
            default_type text/html;
            try_files /dashboard.html =404;
        }

        # ---------------------------------------------------------------------
        # 1. Backend API Routes (ส่งต่อไปยัง Backend 172.20.10.6:8000)
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_node;
        }

        location ~ ^/(generations|auth|uploads?|models|tools|admin|callback|healthz|docs|openapi.json|redoc) {
            proxy_pass http://backend_node;
        }

        # ---------------------------------------------------------------------
        # 2. Frontend Web Routes (ส่งต่อไปยัง Frontend 172.20.10.8:5500)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_node;
        }
    }
}
