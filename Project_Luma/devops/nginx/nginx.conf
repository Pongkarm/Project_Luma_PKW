# devops/nginx/nginx.conf — Production-ready Nginx config for Project LUMA
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance Settings
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    
    # 50MB Max upload for inpainting masks and original images
    client_max_body_size 50M;

    # Gzip Compression (Text-only; never gzip images)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Cache Zone for Uploaded Images
    proxy_cache_path /var/cache/nginx/luma levels=1:2 keys_zone=img_cache:10m max_size=1g inactive=24h;

    # Upstream Node Definitions
    upstream backend_node {
        server 192.168.1.20:5000;
        keepalive 32;
    }

    upstream ai_node {
        server 192.168.1.30:7860;
        keepalive 16;
    }

    server {
        listen 80;
        server_name 192.168.1.10;

        # 1. Serve Frontend Static Files
        location / {
            root /var/www/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Uploaded Images Caching (24 Hours)
        location /uploads/ {
            proxy_pass http://backend_node;
            proxy_cache img_cache;
            proxy_cache_valid 200 24h;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, no-transform";
        }

        # 3. Quick APIs (Auth, User, Gallery - 30s Timeout)
        location /api/ {
            proxy_pass http://backend_node;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. Long-Running AI Generation Tasks (300s Timeout + No Buffering)
        location /api/generate {
            proxy_pass http://backend_node;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. Direct AI Health Check (Optional Proxy)
        location /ai/health {
            proxy_pass http://ai_node/ai/health;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
    }
}
